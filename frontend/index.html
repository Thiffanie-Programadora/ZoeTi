<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/zoeti-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZoeTi | Personal Shopper & Importaciones hacia Costa Rica</title>
    <meta
      name="description"
      content="ZoeTi Personal Shopper: Importaciones internacionales exclusivas desde México, Colombia, Perú y Panamá directo a la puerta de tu casa en Costa Rica."
    />
    <!-- Tipografías Corporativas: Cormorant Garamond (Serif Clásico) y Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS Runtime con la configuración oficial de ZoeTi -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              zoeti: {
                mint: '#D1E8E2',
                'mint-soft': '#E5F3EF',
                'mint-deep': '#B7DAD1',
                bg: '#F7FCFA',
                plum: '#4A2040',
                'plum-light': '#68325B',
                'plum-dark': '#32132B',
              },
            },
            fontFamily: {
              serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            },
            boxShadow: {
              zoeti: '0 14px 38px -10px rgba(74, 32, 64, 0.10)',
              'zoeti-lg': '0 22px 50px -12px rgba(74, 32, 64, 0.16)',
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-[#F7FCFA] text-[#4A2040] font-sans antialiased selection:bg-[#D1E8E2] selection:text-[#4A2040]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
